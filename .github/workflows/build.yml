name: Build Lumina Web

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (for example: v0.1.0). Leave empty to skip the release job.'
        required: false
        type: string
      release_notes:
        description: 'Optional release notes.'
        required: false
        type: string

jobs:
  build-web:
    runs-on: ubuntu-latest
    outputs:
      release_tier: ${{ steps.release-gate.outputs.release_tier }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            canvas-agent/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix canvas-agent

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the Web release gate and derive release tier
        id: release-gate
        shell: bash
        run: |
          set -o pipefail
          npm run verify:web-release -- --channel auto --json | tee release-gate.log
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';

          const reportLine = fs.readFileSync('release-gate.log', 'utf8')
            .split(/\r?\n/)
            .filter(Boolean)
            .at(-1);
          const report = JSON.parse(reportLine);
          if (!['beta', 'complete'].includes(report.releaseTier)) {
            throw new Error(`Unexpected Web release tier: ${report.releaseTier}`);
          }
          console.log(`release_tier=${report.releaseTier}`);
          NODE

      - name: Upload static Web bundle
        uses: actions/upload-artifact@v4
        with:
          name: lumina-web-static
          path: dist
          if-no-files-found: error

      - name: Upload Generation Gateway
        uses: actions/upload-artifact@v4
        with:
          name: lumina-generation-gateway
          path: gateway
          if-no-files-found: error

      - name: Upload Codex plugin and companion
        uses: actions/upload-artifact@v4
        with:
          name: lumina-codex-plugin
          path: |
            plugins/lumina-canvas
            canvas-agent/dist
            canvas-agent/web-dist
            canvas-agent/package.json
            canvas-agent/README.md
          if-no-files-found: error

  release:
    if: >-
      (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')) &&
      (needs.build-web.outputs.release_tier == 'beta' || needs.build-web.outputs.release_tier == 'complete')
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          name: ${{ needs.build-web.outputs.release_tier == 'beta' && format('{0} Beta', github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name) || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name) }}
          body: ${{ github.event.inputs.release_notes || 'Lumina Web release. Build artifacts are available from this workflow run.' }}
          generate_release_notes: false
          prerelease: ${{ needs.build-web.outputs.release_tier == 'beta' }}
