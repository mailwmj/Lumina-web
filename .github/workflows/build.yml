name: Build Lumina Web

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (for example: v0.1.0). Leave empty to skip the release job.'
        required: false
        type: string
      release_notes:
        description: 'Optional release notes.'
        required: false
        type: string

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            canvas-agent/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix canvas-agent

      - name: Verify Web contracts
        run: npm run test:web-only

      - name: Test Web application and Gateway
        run: |
          npx vitest run
          npx vitest run gateway

      - name: Test Codex companion and plugin
        run: |
          npm run canvas-agent:test
          node --test plugins/lumina-canvas/plugin.node-test.mjs

      - name: Build static Web bundle
        run: npm run build

      - name: Run browser E2E against the production bundle
        env:
          LUMINA_E2E_SERVER_COMMAND: npm run preview -- --host 127.0.0.1 --port 4174
        run: npm run test:e2e

      - name: Upload static Web bundle
        uses: actions/upload-artifact@v4
        with:
          name: lumina-web-static
          path: dist
          if-no-files-found: error

      - name: Upload Generation Gateway
        uses: actions/upload-artifact@v4
        with:
          name: lumina-generation-gateway
          path: gateway
          if-no-files-found: error

      - name: Upload Codex plugin and companion
        uses: actions/upload-artifact@v4
        with:
          name: lumina-codex-plugin
          path: |
            plugins/lumina-canvas
            canvas-agent/dist
            canvas-agent/web-dist
            canvas-agent/package.json
            canvas-agent/README.md
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          body: ${{ github.event.inputs.release_notes || 'Lumina Web release. Build artifacts are available from this workflow run.' }}
          generate_release_notes: false
